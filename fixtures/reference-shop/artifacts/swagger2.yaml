{
  "swagger": "2.0",
  "info": {
    "title": "Reference Shop",
    "version": "1.0.0",
    "license": {
      "name": "Apache-2.0"
    }
  },
  "host": "127.0.0.1:3000",
  "basePath": "/",
  "schemes": [
    "http"
  ],
  "produces": [
    "application/json"
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "Healthy service",
            "schema": {
              "type": "object",
              "required": [
                "status"
              ],
              "properties": {
                "status": {
                  "type": "string",
                  "enum": [
                    "ok"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/auth/token": {
      "post": {
        "operationId": "createToken",
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "object",
              "required": [
                "email",
                "password"
              ],
              "properties": {
                "email": {
                  "type": "string"
                },
                "password": {
                  "type": "string",
                  "minLength": 1
                }
              }
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Bearer token"
          }
        }
      }
    },
    "/api/auth/refresh": {
      "post": {
        "operationId": "refreshToken",
        "responses": {
          "200": {
            "description": "Fresh token with credentials"
          }
        },
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "object",
              "required": [
                "email",
                "password"
              ],
              "properties": {
                "email": {
                  "type": "string"
                },
                "password": {
                  "type": "string",
                  "minLength": 1
                }
              }
            }
          }
        ]
      }
    },
    "/api/products": {
      "get": {
        "operationId": "listProducts",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 2
          },
          {
            "name": "offset",
            "in": "query",
            "type": "integer",
            "minimum": 0,
            "default": 0
          }
        ],
        "responses": {
          "200": {
            "description": "Paginated products",
            "schema": {
              "type": "object",
              "required": [
                "items",
                "total",
                "nextOffset"
              ],
              "properties": {
                "items": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": [
                      "id",
                      "name",
                      "priceCents"
                    ],
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "priceCents": {
                        "type": "integer",
                        "minimum": 0
                      }
                    }
                  }
                },
                "total": {
                  "type": "integer"
                },
                "nextOffset": {
                  "type": "integer"
                }
              }
            }
          }
        }
      },
      "post": {
        "operationId": "createProduct",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Product",
            "schema": {
              "type": "object",
              "required": [
                "id",
                "name",
                "priceCents"
              ],
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string"
                },
                "name": {
                  "type": "string"
                },
                "priceCents": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "priceCents"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1
                },
                "priceCents": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          }
        ]
      }
    },
    "/api/products/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "type": "string"
        }
      ],
      "get": {
        "operationId": "getProduct",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Product",
            "schema": {
              "type": "object",
              "required": [
                "id",
                "name",
                "priceCents"
              ],
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string"
                },
                "name": {
                  "type": "string"
                },
                "priceCents": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          }
        }
      },
      "put": {
        "operationId": "updateProduct",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Updated product",
            "schema": {
              "type": "object",
              "required": [
                "id",
                "name",
                "priceCents"
              ],
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string"
                },
                "name": {
                  "type": "string"
                },
                "priceCents": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "priceCents"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1
                },
                "priceCents": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          }
        ]
      },
      "delete": {
        "operationId": "deleteProduct",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Deletion result"
          }
        }
      }
    },
    "/api/cart": {
      "get": {
        "operationId": "getCart",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persistent cart"
          }
        }
      },
      "post": {
        "operationId": "setCartItem",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Cart updated"
          }
        },
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "productId",
                "quantity"
              ],
              "properties": {
                "productId": {
                  "type": "string"
                },
                "quantity": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          }
        ]
      },
      "delete": {
        "operationId": "clearCart",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Cart cleared"
          }
        }
      }
    },
    "/api/orders": {
      "get": {
        "operationId": "listOrders",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Orders"
          },
          "401": {
            "description": "Authentication required"
          }
        }
      },
      "post": {
        "operationId": "createOrder",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "type": "string",
            "minLength": 1
          }
        ],
        "responses": {
          "200": {
            "description": "Idempotent replay"
          },
          "201": {
            "description": "Persisted order"
          },
          "401": {
            "description": "Authentication required"
          },
          "422": {
            "description": "Empty cart"
          }
        }
      }
    },
    "/api/users": {
      "post": {
        "operationId": "createUser",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "Cleanup-owned user"
          }
        },
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "email",
                "password"
              ],
              "properties": {
                "email": {
                  "type": "string",
                  "format": "email"
                },
                "password": {
                  "type": "string",
                  "minLength": 1
                }
              }
            }
          }
        ]
      }
    },
    "/api/users/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "type": "string"
        }
      ],
      "delete": {
        "operationId": "deleteUser",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Delete owned user"
          }
        }
      }
    },
    "/api/profile/file": {
      "post": {
        "operationId": "uploadProfile",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "201": {
            "description": "File uploaded"
          }
        },
        "parameters": [
          {
            "name": "body",
            "in": "body",
            "required": true,
            "schema": {
              "type": "string",
              "format": "binary"
            }
          }
        ],
        "consumes": [
          "application/octet-stream"
        ]
      },
      "get": {
        "operationId": "downloadProfile",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Profile bytes",
            "schema": {
              "type": "string",
              "format": "binary"
            }
          }
        }
      }
    }
  },
  "securityDefinitions": {
    "bearerAuth": {
      "type": "apiKey",
      "name": "Authorization",
      "in": "header"
    }
  },
  "definitions": {
    "Product": {
      "type": "object",
      "required": [
        "id",
        "name",
        "priceCents"
      ],
      "additionalProperties": false,
      "properties": {
        "id": {
          "type": "string"
        },
        "name": {
          "type": "string"
        },
        "priceCents": {
          "type": "integer",
          "minimum": 0
        }
      }
    }
  }
}
