# TestMaster distributed profile, reference deployment on one host (ADR-035, specs/08 `distributed`).
# A standalone file: `docker compose -f compose.distributed.yaml up`. The single-server profile
# stays in compose.yaml and is not affected.
#
#   caddy    -- TLS termination, the only public port (8443); round robin over both controllers
#   server   -- controller 1: API, portal, elected loops; PostgreSQL + S3, internalOrigin server:7331
#   server-2 -- controller 2: the same image and shared state, internalOrigin server-2:7331
#   postgres -- PostgreSQL 17 with TLS, published only on 127.0.0.1
#   minio    -- S3-compatible store with TLS (the deployment CA of gen-tls.sh), published only on 127.0.0.1
#   minio-init -- one-shot: evidence bucket, Object Lock backup bucket, two bucket-scoped identities
#
# Remote workers (`worker start --mode remote`) and the backup agent run on their own hosts, outside
# this file: a worker needs its Docker daemon and holds no database or storage credential, and the
# backup agent is the only holder of the backup bucket credential. See docs/operations/distributed.md.
# Everything is configured through the environment; see README.md and .env.distributed.example.
name: ${TESTMASTER_COMPOSE_PROJECT:-testmaster-distributed}

x-controller: &controller
  build:
    context: ../..
    dockerfile: containers/server/Dockerfile
  image: testmaster-server:local
  restart: unless-stopped
  # The master key and the S3 credential files must belong to the user the process runs as, so
  # set this to `id -u`:`id -g` on a rootful daemon; container root is the operator on a rootless one.
  user: "${TESTMASTER_CONTAINER_USER:-0:0}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  environment:
    PGSSLROOTCERT: /etc/testmaster/tls/ca.crt
  networks: [backend, frontend]
  healthcheck:
    # /v1/health/live is the one unauthenticated route. Operators read full readiness with
    # `testmaster server readiness --config <file>`.
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:7331/v1/health/live',{headers:{'x-forwarded-proto':'https'}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 6

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-tls-entrypoint.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pg-tls/server.crt
      - -c
      - ssl_key_file=/run/pg-tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    secrets:
      - postgres_admin_password
    volumes:
      - ${TESTMASTER_PG_DATA:?set TESTMASTER_PG_DATA to the (volume-encrypted) database directory}:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./pg-tls-entrypoint.sh:/usr/local/bin/pg-tls-entrypoint.sh:ro
      - ${TESTMASTER_TLS_DIR:?set TESTMASTER_TLS_DIR}/postgres:/etc/postgresql/tls:ro
    ports:
      - "127.0.0.1:${TESTMASTER_PG_PORT:-55432}:5432"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The Docker Hub repository of this image is gone: the digest below is only reachable from an
  # image store that already holds it (docker save / load) or from a registry mirror. Keep a saved
  # copy; docs/adr/035-distributed-profile.md records the risk and the replacement path.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    user: "${TESTMASTER_CONTAINER_USER:-0:0}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: "off"
      HOME: /tmp
    command: ["server", "/data", "--address", ":9000", "--certs-dir", "/etc/minio/certs"]
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ${TESTMASTER_MINIO_DATA:?set TESTMASTER_MINIO_DATA to the (volume-encrypted) object store directory}:/data
      - ${TESTMASTER_TLS_DIR}/minio:/etc/minio/certs:ro
    ports:
      - "127.0.0.1:${TESTMASTER_S3_PORT:-59000}:9000"
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - --cacert
        - /etc/minio/certs/CAs/ca.crt
        - https://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    user: "${TESTMASTER_CONTAINER_USER:-0:0}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    environment:
      HOME: /tmp
      TESTMASTER_S3_BUCKET: ${TESTMASTER_S3_BUCKET:-testmaster-evidence}
      TESTMASTER_S3_BACKUP_BUCKET: ${TESTMASTER_S3_BACKUP_BUCKET:-testmaster-backups}
      TESTMASTER_BACKUP_LOCK_DAYS: ${TESTMASTER_BACKUP_LOCK_DAYS:-1}
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
      - s3_evidence_access_key_id
      - s3_evidence_secret_access_key
      - s3_backup_access_key_id
      - s3_backup_secret_access_key
    volumes:
      - ./minio-init.sh:/usr/local/bin/minio-init.sh:ro
      - ${TESTMASTER_TLS_DIR}/ca.crt:/etc/testmaster/tls/ca.crt:ro
    networks: [backend]

  server:
    <<: *controller
    command: ["server", "start", "--mode", "distributed", "--config", "/etc/testmaster/server.json"]
    volumes:
      - ${TESTMASTER_RUNTIME_DIR:?set TESTMASTER_RUNTIME_DIR to a built TestMaster checkout}:/opt/testmaster:ro
      - ${TESTMASTER_CONFIG:?set TESTMASTER_CONFIG to the controller 1 configuration file}:/etc/testmaster/server.json:ro
      - ${TESTMASTER_TLS_DIR}/ca.crt:/etc/testmaster/tls/ca.crt:ro
      # Per-process scratch (staging, uploads, temp); never shared between controllers.
      - ${TESTMASTER_STAGING_DIR:?set TESTMASTER_STAGING_DIR}:/var/lib/testmaster/staging
      - ${TESTMASTER_KEY_DIR:?set TESTMASTER_KEY_DIR}:/etc/testmaster/keys
      - ${TESTMASTER_DB_PASSWORD_FILE:?set TESTMASTER_DB_PASSWORD_FILE}:/run/testmaster/db.password:ro
      # The evidence credential only; the backup bucket credential is not mounted here.
      - ${TESTMASTER_S3_EVIDENCE_ID_FILE:?set TESTMASTER_S3_EVIDENCE_ID_FILE}:/run/testmaster/s3-access-key-id:ro
      - ${TESTMASTER_S3_EVIDENCE_SECRET_FILE:?set TESTMASTER_S3_EVIDENCE_SECRET_FILE}:/run/testmaster/s3-secret-access-key:ro
    ports:
      - "127.0.0.1:${TESTMASTER_CONTROLLER_PORT:-17331}:7331"

  server-2:
    <<: *controller
    command: ["server", "start", "--mode", "distributed", "--config", "/etc/testmaster/server.json"]
    volumes:
      - ${TESTMASTER_RUNTIME_DIR}:/opt/testmaster:ro
      - ${TESTMASTER_CONFIG_2:?set TESTMASTER_CONFIG_2 to the controller 2 configuration file}:/etc/testmaster/server.json:ro
      - ${TESTMASTER_TLS_DIR}/ca.crt:/etc/testmaster/tls/ca.crt:ro
      - ${TESTMASTER_STAGING_DIR_2:?set TESTMASTER_STAGING_DIR_2}:/var/lib/testmaster/staging
      # One key directory on this single host; on a second host this is that host's own copy of the
      # master key (docs/operations/distributed.md, key rotation).
      - ${TESTMASTER_KEY_DIR}:/etc/testmaster/keys
      - ${TESTMASTER_DB_PASSWORD_FILE}:/run/testmaster/db.password:ro
      - ${TESTMASTER_S3_EVIDENCE_ID_FILE}:/run/testmaster/s3-access-key-id:ro
      - ${TESTMASTER_S3_EVIDENCE_SECRET_FILE}:/run/testmaster/s3-secret-access-key:ro
    ports:
      - "127.0.0.1:${TESTMASTER_CONTROLLER_PORT_2:-17332}:7331"

  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      server-2:
        condition: service_healthy
    environment:
      TESTMASTER_PUBLIC_HOST: ${TESTMASTER_PUBLIC_HOST:-localhost}
    ports:
      - "${TESTMASTER_PUBLIC_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile.distributed:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [frontend]

networks:
  # Not `internal`: an internal network cannot publish the loopback ports that operators and the
  # host workers use. Reach is limited by the loopback publishes, by pg_hba.conf (TLS only) and by
  # the S3 identities. The controllers talk to each other over this network in plain HTTP
  # (`internalOrigin`); every forwarded call carries the worker's own signed proof, which only the
  # holder verifies. Put the backend network on a private link if it crosses hosts.
  backend: {}
  frontend: {}

volumes:
  caddy_data: {}

secrets:
  postgres_admin_password:
    file: ${TESTMASTER_PG_ADMIN_PASSWORD_FILE:?set TESTMASTER_PG_ADMIN_PASSWORD_FILE}
  minio_root_user:
    file: ${TESTMASTER_MINIO_ROOT_USER_FILE:?set TESTMASTER_MINIO_ROOT_USER_FILE}
  minio_root_password:
    file: ${TESTMASTER_MINIO_ROOT_PASSWORD_FILE:?set TESTMASTER_MINIO_ROOT_PASSWORD_FILE}
  s3_evidence_access_key_id:
    file: ${TESTMASTER_S3_EVIDENCE_ID_FILE}
  s3_evidence_secret_access_key:
    file: ${TESTMASTER_S3_EVIDENCE_SECRET_FILE}
  s3_backup_access_key_id:
    file: ${TESTMASTER_S3_BACKUP_ID_FILE:?set TESTMASTER_S3_BACKUP_ID_FILE}
  s3_backup_secret_access_key:
    file: ${TESTMASTER_S3_BACKUP_SECRET_FILE:?set TESTMASTER_S3_BACKUP_SECRET_FILE}
