# TLS only (ADR-019). Local socket access exists for pg_isready inside the container; every TCP
# connection must use TLS (`hostssl`) and SCRAM; plain `host` entries are absent, so a plaintext
# connection matches nothing and is rejected. The compose backend network is internal, and the
# published loopback port reaches the same listener.
local   all   postgres                      trust
hostssl all   all        172.16.0.0/12      scram-sha-256
hostssl all   all        10.0.0.0/8         scram-sha-256
hostssl all   all        192.168.0.0/16     scram-sha-256
hostssl all   all        127.0.0.1/32       scram-sha-256
