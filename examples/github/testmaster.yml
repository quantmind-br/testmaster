{
  "name": "TestMaster",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "execute": {
      "if": "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "env": {
        "TESTMASTER_OFFLINE": "true",
        "TESTMASTER_MANIFEST_SHA256": "3d79df4e6676d51816401bc5cc6edb86b5b1977473dc60f94f423e3a74c91f2d"
      },
      "outputs": {
        "artifact-id": "${{ steps.upload.outputs.artifact-id }}",
        "artifact-sha256": "${{ steps.upload.outputs.artifact-digest }}",
        "report-hash": "${{ steps.testmaster.outputs.report-hash }}",
        "job-id": "${{ steps.identity.outputs.job-id }}",
        "assessed-sha": "${{ github.event.pull_request.head.sha || github.sha }}",
        "checkout-sha": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Configure TestMaster paths",
          "run": "set -euo pipefail\n{\n  printf 'TESTMASTER_DATA_DIR=%s\\n' \"$RUNNER_TEMP/testmaster-execution-data\"\n  printf 'TESTMASTER_RUNTIME_DIR=%s\\n' \"$RUNNER_TEMP/testmaster-runtime\"\n  printf 'TESTMASTER_CLI=%s\\n' \"$RUNNER_TEMP/testmaster-runtime/apps/cli/dist/main.js\"\n  printf 'TESTMASTER_RELEASE_DIR=%s\\n' \"$RUNNER_TEMP/testmaster-release\"\n} >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2
          }
        },
        {
          "name": "Checkout trusted distribution only",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "quantmind-br/testmaster",
            "ref": "fc5e7eb9af9d008af8ba2b3e04ed97fafcba7990",
            "path": ".testmaster-trusted",
            "persist-credentials": false
          }
        },
        {
          "name": "Exclude runner state from the assessed tree",
          "run": "set -euo pipefail\nexclude=$(git rev-parse --git-path info/exclude)\nmkdir -p \"$(dirname \"$exclude\")\"\nprintf '/.testmaster-trusted/\\n/testmaster.config.json\\n' >> \"$exclude\""
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Configure locked image store",
          "run": "set -euo pipefail\nconfig=/etc/docker/daemon.json\ncurrent=$(sudo cat \"$config\" 2>/dev/null || echo '{}')\necho \"$current\" | jq '.features = ((.features // {}) + {\"containerd-snapshotter\": true})' | sudo tee \"$config\" >/dev/null\nsudo systemctl restart docker"
        },
        {
          "name": "Download anonymous pinned public runtime",
          "run": "set -euo pipefail\nmkdir -m 700 \"$TESTMASTER_RELEASE_DIR\" \"$TESTMASTER_RELEASE_DIR/images\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/manifest.json' --output \"$TESTMASTER_RELEASE_DIR/manifest.json\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/runtime.tar.gz' --output \"$TESTMASTER_RELEASE_DIR/runtime.tar.gz\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/testmaster-runner.tar.gz.part-0000' --output \"$TESTMASTER_RELEASE_DIR/images/testmaster-runner.tar.gz.part-0000\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/testmaster-runner-python.tar.gz.part-0000' --output \"$TESTMASTER_RELEASE_DIR/images/testmaster-runner-python.tar.gz.part-0000\"\nprintf '%s  %s\\n' \"$TESTMASTER_MANIFEST_SHA256\" \"$TESTMASTER_RELEASE_DIR/manifest.json\" | sha256sum --check --status"
        },
        {
          "name": "Install verified runtime",
          "run": "node .testmaster-trusted/tools/dist/distribution/install.js --manifest \"$TESTMASTER_RELEASE_DIR/manifest.json\" --manifest-sha256 \"$TESTMASTER_MANIFEST_SHA256\" --dest \"$TESTMASTER_RUNTIME_DIR\""
        },
        {
          "id": "identity",
          "name": "Bind execution job identity",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nid=$(gh api \"repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs\" --jq '.jobs[] | select(.name == \"execute\" and .status == \"in_progress\") | .id')\n[[ \"$id\" =~ ^[0-9]+$ ]]\nprintf 'job-id=%s\\n' \"$id\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Prepare application and TestMaster workspace",
          "run": "set -euo pipefail\ntest \"$(id -u)\" != 0\nenv -u GITHUB_TOKEN -u GH_TOKEN bash -- \"examples/github/setup.sh\""
        },
        {
          "id": "testmaster",
          "uses": "quantmind-br/testmaster@fc5e7eb9af9d008af8ba2b3e04ed97fafcba7990",
          "with": {
            "runtime-manifest": "${{ runner.temp }}/testmaster-release/manifest.json#3d79df4e6676d51816401bc5cc6edb86b5b1977473dc60f94f423e3a74c91f2d",
            "all": "true",
            "environment": "ci",
            "target-url": "http://127.0.0.1:18080/",
            "commit-sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "checkout-sha": "${{ github.sha }}",
            "quarantine-policy": "strict",
            "publish-check": "false"
          }
        },
        {
          "id": "envelope",
          "if": "${{ always() && steps.testmaster.outputs.report-path != '' }}",
          "env": {
            "REPORT": "${{ steps.testmaster.outputs.report-path }}"
          },
          "run": "set -euo pipefail\nmkdir -m 700 \"$RUNNER_TEMP/testmaster-envelope\"\nsource=$(dirname \"$REPORT\")\nfor file in report.json junit.xml summary.md bundle-index.json completion.json; do\n  test -f \"$source/$file\" && test ! -L \"$source/$file\"\n  cp -- \"$source/$file\" \"$RUNNER_TEMP/testmaster-envelope/$file\"\ndone"
        },
        {
          "id": "upload",
          "if": "${{ always() && steps.envelope.outcome == 'success' }}",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "testmaster-ci-${{ steps.identity.outputs.job-id }}",
            "path": "${{ runner.temp }}/testmaster-envelope/*",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        }
      ]
    },
    "publish": {
      "needs": "execute",
      "if": "${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && needs.execute.outputs.artifact-id != '' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "actions": "read",
        "checks": "write"
      },
      "env": {
        "TESTMASTER_OFFLINE": "true",
        "TESTMASTER_MANIFEST_SHA256": "3d79df4e6676d51816401bc5cc6edb86b5b1977473dc60f94f423e3a74c91f2d"
      },
      "steps": [
        {
          "name": "Configure TestMaster paths",
          "run": "set -euo pipefail\n{\n  printf 'TESTMASTER_DATA_DIR=%s\\n' \"$RUNNER_TEMP/testmaster-publisher-data\"\n  printf 'TESTMASTER_RUNTIME_DIR=%s\\n' \"$RUNNER_TEMP/testmaster-runtime\"\n  printf 'TESTMASTER_CLI=%s\\n' \"$RUNNER_TEMP/testmaster-runtime/apps/cli/dist/main.js\"\n  printf 'TESTMASTER_RELEASE_DIR=%s\\n' \"$RUNNER_TEMP/testmaster-release\"\n} >> \"$GITHUB_ENV\""
        },
        {
          "name": "Checkout trusted distribution only",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "quantmind-br/testmaster",
            "ref": "fc5e7eb9af9d008af8ba2b3e04ed97fafcba7990",
            "path": ".testmaster-trusted",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Configure locked image store",
          "run": "set -euo pipefail\nconfig=/etc/docker/daemon.json\ncurrent=$(sudo cat \"$config\" 2>/dev/null || echo '{}')\necho \"$current\" | jq '.features = ((.features // {}) + {\"containerd-snapshotter\": true})' | sudo tee \"$config\" >/dev/null\nsudo systemctl restart docker"
        },
        {
          "name": "Download anonymous pinned public runtime",
          "run": "set -euo pipefail\nmkdir -m 700 \"$TESTMASTER_RELEASE_DIR\" \"$TESTMASTER_RELEASE_DIR/images\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/manifest.json' --output \"$TESTMASTER_RELEASE_DIR/manifest.json\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/runtime.tar.gz' --output \"$TESTMASTER_RELEASE_DIR/runtime.tar.gz\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/testmaster-runner.tar.gz.part-0000' --output \"$TESTMASTER_RELEASE_DIR/images/testmaster-runner.tar.gz.part-0000\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' 'https://github.com/quantmind-br/testmaster/releases/download/runtime-4df8ba5/testmaster-runner-python.tar.gz.part-0000' --output \"$TESTMASTER_RELEASE_DIR/images/testmaster-runner-python.tar.gz.part-0000\"\nprintf '%s  %s\\n' \"$TESTMASTER_MANIFEST_SHA256\" \"$TESTMASTER_RELEASE_DIR/manifest.json\" | sha256sum --check --status"
        },
        {
          "name": "Publish frozen sanitized envelope",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "TESTMASTER_RUNTIME_MANIFEST": "${{ runner.temp }}/testmaster-release/manifest.json#3d79df4e6676d51816401bc5cc6edb86b5b1977473dc60f94f423e3a74c91f2d",
            "TESTMASTER_ARTIFACT_ID": "${{ needs.execute.outputs.artifact-id }}",
            "TESTMASTER_ARTIFACT_SHA256": "${{ needs.execute.outputs.artifact-sha256 }}",
            "TESTMASTER_REPORT_HASH": "${{ needs.execute.outputs.report-hash }}",
            "TESTMASTER_WORKFLOW_RUN_ID": "${{ github.run_id }}",
            "TESTMASTER_EXECUTION_JOB_ID": "${{ needs.execute.outputs.job-id }}",
            "TESTMASTER_ASSESSED_SHA": "${{ needs.execute.outputs.assessed-sha }}",
            "TESTMASTER_CHECKOUT_SHA": "${{ needs.execute.outputs.checkout-sha }}"
          },
          "run": "node .testmaster-trusted/tools/dist/github-action/publish.js"
        }
      ]
    }
  }
}
